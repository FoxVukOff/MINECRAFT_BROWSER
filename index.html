<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MiniCraft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: monospace; user-select: none; }
  #game { display: block; width: 100%; height: 100%; }

  /* Прицел */
  #crosshair {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 22px; height: 22px; pointer-events: none; z-index: 10;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.85);
    box-shadow: 0 0 1px rgba(0,0,0,0.6);
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after  { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

  /* Хотбар */
  #hotbar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 10; padding: 4px; background: rgba(0,0,0,0.35);
    border: 2px solid rgba(0,0,0,0.5); border-radius: 4px;
  }
  .slot {
    width: 52px; height: 52px; background: rgba(0,0,0,0.25);
    border: 2px solid rgba(120,120,120,0.6); position: relative; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .slot.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.6); }
  .slot canvas { width: 40px; height: 40px; image-rendering: pixelated; }
  .slot .count {
    position: absolute; right: 2px; bottom: 0; color: #fff; font-size: 14px;
    text-shadow: 1px 1px 0 #000; font-weight: bold;
  }

  /* Инвентарь */
  #inventory {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; z-index: 20; background: #c6c6c6; border: 4px solid #555;
    border-radius: 6px; padding: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #inventory.open { display: block; }
  #inventory h2 { font-size: 16px; color: #333; margin-bottom: 10px; text-align: center; }
  #invGrid { display: grid; grid-template-columns: repeat(5, 56px); gap: 6px; }
  .inv-item {
    width: 56px; height: 56px; background: #8b8b8b; border: 2px solid #373737;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }
  .inv-item:hover { background: #9d9d9d; }
  .inv-item canvas { width: 38px; height: 38px; image-rendering: pixelated; }
  .inv-item .count { position: absolute; right: 2px; bottom: 0; color:#fff; text-shadow:1px 1px 0 #000; font-size:13px; }
  .inv-item .nm { font-size: 9px; color:#222; margin-top:2px; }

  /* HUD верх */
  #hud {
    position: fixed; left: 10px; top: 10px; z-index: 10; color: #fff;
    text-shadow: 1px 1px 0 #000; font-size: 13px; line-height: 1.5; pointer-events: none;
  }

  /* Синий оверлей под водой */
  #waterOverlay {
    position: fixed; inset: 0; z-index: 8; pointer-events: none;
    background: rgba(40, 90, 160, 0.38); display: none;
  }
  #waterOverlay.on { display: block; }

  /* Шкала кислорода (пузырьки) */
  #oxygen {
    position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%);
    z-index: 12; display: none; gap: 3px;
  }
  #oxygen.on { display: flex; }
  #oxygen .bubble {
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfeeff, #2a78c8);
    box-shadow: 0 0 1px #000, inset 0 0 2px rgba(255,255,255,0.6);
  }
  #oxygen .bubble.empty { background: none; box-shadow: none; }

  /* Подсказки / меню старта */
  #overlay {
    position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; color: #fff; text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay .box { background: rgba(20,20,20,0.9); padding: 24px 30px; border: 2px solid #555; border-radius: 8px; width: 440px; max-height: 92vh; overflow-y: auto; }
  #overlay h1 { font-size: 30px; margin-bottom: 6px; letter-spacing: 2px; }
  #overlay p { font-size: 12px; line-height: 1.6; margin: 3px 0; color:#ddd; }
  #overlay button {
    margin-top: 10px; padding: 10px 22px; font-size: 14px; font-family: monospace;
    background: #5a9e3a; color:#fff; border: 2px solid #3d6e27; border-radius: 4px; cursor: pointer;
  }
  #overlay button:hover { background: #6bb544; }
  .keys { display:inline-block; text-align:left; margin-top:12px; }
  kbd { background:#333; border:1px solid #666; border-radius:3px; padding:1px 6px; margin:0 2px; font-size:12px; }

  /* Менеджер миров */
  .wm-section { margin-top: 16px; text-align: left; border-top: 1px solid #444; padding-top: 12px; }
  .wm-section h3 { font-size: 14px; color: #9fd; margin-bottom: 8px; }
  .wm-input {
    display: block; width: 100%; margin-bottom: 8px; padding: 9px 10px;
    font-family: monospace; font-size: 13px; background: #2a2a2a; color: #fff;
    border: 1px solid #555; border-radius: 4px; box-sizing: border-box;
  }
  .wm-input::placeholder { color: #888; }
  .wm-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
  .wm-empty { color: #888; font-size: 12px; padding: 6px; }
  .wm-item {
    display: flex; align-items: center; gap: 8px; background: #2c2c2c;
    border: 1px solid #444; border-radius: 4px; padding: 8px 10px;
  }
  .wm-item .wm-info { flex: 1; min-width: 0; }
  .wm-item .wm-name { font-size: 13px; color: #fff; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wm-item .wm-meta { font-size: 10px; color: #9a9a9a; }
  .wm-item button { margin: 0; padding: 6px 10px; font-size: 12px; }
  .wm-load { background: #4a7fc0 !important; border-color: #2f5a90 !important; }
  .wm-load:hover { background: #5b93d6 !important; }
  .wm-del { background: #a04040 !important; border-color: #6e2727 !important; }
  .wm-del:hover { background: #c05050 !important; }

  /* Кнопка меню в игре */
  #menuBtn {
    position: fixed; right: 10px; top: 10px; z-index: 12; padding: 6px 12px; display: none;
    font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.45);
    color: #fff; border: 1px solid #666; border-radius: 4px; cursor: pointer;
  }
  #menuBtn:hover { background: rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="crosshair"></div>
<div id="waterOverlay"></div>
<div id="oxygen"></div>

<div id="hud"></div>
<button id="menuBtn">Меню (Esc)</button>
<div id="saveToast" style="position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:14;background:rgba(0,0,0,0.7);color:#9fd;padding:6px 14px;border-radius:4px;font-family:monospace;font-size:13px;display:none;">Сохранено ✓</div>

<div id="hotbar"></div>

<div id="inventory">
  <h2>Инвентарь</h2>
  <div id="invGrid"></div>
</div>

<div id="overlay">
  <div class="box">
    <h1>MiniCraft</h1>
    <p>Бесконечный мир в духе старого Minecraft</p>

    <div class="wm-section">
      <h3>Создать мир</h3>
      <input id="newWorldName" class="wm-input" type="text" placeholder="Название мира" maxlength="24">
      <input id="newWorldSeed" class="wm-input" type="text" placeholder="Сид (число/текст, можно пусто)" maxlength="32">
      <button id="createWorldBtn">Создать и играть</button>
    </div>

    <div class="wm-section">
      <h3>Мои миры</h3>
      <div id="worldList" class="wm-list"></div>
    </div>

    <div class="keys">
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — движение · <kbd>Ctrl</kbd> — бег</p>
      <p><kbd>Space</kbd> — прыжок/всплыть · <kbd>Shift</kbd> — присесть/нырять</p>
      <p><kbd>ЛКМ</kbd> (удерж.) — ломать · <kbd>ПКМ</kbd> — ставить</p>
      <p><kbd>E</kbd> — инвентарь · <kbd>1-5</kbd>/колесо — слот · <kbd>O</kbd> — сохранить</p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
